<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO list</title>
  </head>
  <body data-theme="dark">
    <div id="app">
      <div class="container">
        <form class="todo-form" data-todo-form>
          <div class="input-wrapper">
            <input type="text" class="todo-input" id="todo-input" placeholder="" name="todo" data-todo-input>
            <label for="todo" class="todo-label">Add a new task</label>
            <span class="error-message" data-todo-form-error></span>
          </div>
          <button type="submit" class="todo-btn" data-todo-form-btn>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.25 9C17.25 9.18234 17.1776 9.35721 17.0486 9.48614C16.9197 9.61507 16.7448 9.6875 16.5625 9.6875H9.6875V16.5625C9.6875 16.7448 9.61507 16.9197 9.48614 17.0486C9.35721 17.1776 9.18234 17.25 9 17.25C8.81766 17.25 8.6428 17.1776 8.51386 17.0486C8.38493 16.9197 8.3125 16.7448 8.3125 16.5625V9.6875H1.4375C1.25516 9.6875 1.0803 9.61507 0.951364 9.48614C0.822433 9.35721 0.75 9.18234 0.75 9C0.75 8.81766 0.822433 8.6428 0.951364 8.51386C1.0803 8.38493 1.25516 8.3125 1.4375 8.3125H8.3125V1.4375C8.3125 1.25516 8.38493 1.0803 8.51386 0.951364C8.6428 0.822433 8.81766 0.75 9 0.75C9.18234 0.75 9.35721 0.822433 9.48614 0.951364C9.61507 1.0803 9.6875 1.25516 9.6875 1.4375V8.3125H16.5625C16.7448 8.3125 16.9197 8.38493 17.0486 8.51386C17.1776 8.6428 17.25 8.81766 17.25 9Z" fill="none" />
            </svg>
          </button>
        </form>
        <div class="todo__tasks">
          <span class="todo__title">Tasks to do - <span data-task-count>4</span></span>
          <ul class="todo__list" data-todo-list>
            <li class="todo__item">
              <span class="todo__item-text">To study React fundamentals</span>
              <div class="todo__item-btns">
                <button class="todo__btn-complete todo__item-btn" data-todo-complete-btn>
                  <svg width="23" height="22" viewBox="0 0 23 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.7851 6.67391L8.78513 17.6739C8.72128 17.7378 8.64546 17.7885 8.56199 17.8231C8.47853 17.8577 8.38907 17.8755 8.29872 17.8755C8.20837 17.8755 8.11891 17.8577 8.03545 17.8231C7.95199 17.7885 7.87617 17.7378 7.81232 17.6739L2.99982 12.8614C2.87081 12.7324 2.79834 12.5574 2.79834 12.375C2.79834 12.1926 2.87081 12.0176 2.99982 11.8886C3.12882 11.7596 3.30378 11.6871 3.48622 11.6871C3.66866 11.6871 3.84363 11.7596 3.97263 11.8886L8.29872 16.2155L18.8123 5.70109C18.9413 5.57209 19.1163 5.49962 19.2987 5.49962C19.4812 5.49962 19.6561 5.57209 19.7851 5.70109C19.9141 5.8301 19.9866 6.00506 19.9866 6.1875C19.9866 6.36994 19.9141 6.5449 19.7851 6.67391Z" fill="#9E78CF" />
                  </svg>
                </button>
                <button class="todo__btn-remove todo__item-btn" data-todo-remove-btn>
                  <svg width="23" height="22" viewBox="0 0 23 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.6112 4.125H3.48621C3.30387 4.125 3.129 4.19743 3.00007 4.32636C2.87114 4.4553 2.79871 4.63016 2.79871 4.8125C2.79871 4.99484 2.87114 5.1697 3.00007 5.29864C3.129 5.42757 3.30387 5.5 3.48621 5.5H4.17371V17.875C4.17371 18.2397 4.31857 18.5894 4.57643 18.8473C4.8343 19.1051 5.18403 19.25 5.54871 19.25H16.5487C16.9134 19.25 17.2631 19.1051 17.521 18.8473C17.7788 18.5894 17.9237 18.2397 17.9237 17.875V5.5H18.6112C18.7935 5.5 18.9684 5.42757 19.0973 5.29864C19.2263 5.1697 19.2987 4.99484 19.2987 4.8125C19.2987 4.63016 19.2263 4.4553 19.0973 4.32636C18.9684 4.19743 18.7935 4.125 18.6112 4.125ZM16.5487 17.875H5.54871V5.5H16.5487V17.875ZM6.92371 2.0625C6.92371 1.88016 6.99614 1.7053 7.12507 1.57636C7.254 1.44743 7.42887 1.375 7.61121 1.375H14.4862C14.6685 1.375 14.8434 1.44743 14.9723 1.57636C15.1013 1.7053 15.1737 1.88016 15.1737 2.0625C15.1737 2.24484 15.1013 2.4197 14.9723 2.54864C14.8434 2.67757 14.6685 2.75 14.4862 2.75H7.61121C7.42887 2.75 7.254 2.67757 7.12507 2.54864C6.99614 2.4197 6.92371 2.24484 6.92371 2.0625Z" fill="#9E78CF" />
                  </svg>
                </button>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
